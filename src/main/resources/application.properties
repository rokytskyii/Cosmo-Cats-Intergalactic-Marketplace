spring.application.name=cosmocats-market

spring.datasource.url=jdbc:postgresql://localhost:5432/cosmocats_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

external.products.api.url=http://localhost:8081

rest.client.timeout.connect=5000
rest.client.timeout.read=10000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.port=8080

feature.toggles.cosmoCats.enabled=true
feature.toggles.kittyProducts.enabled=false

spring.aop.auto=true
spring.aop.proxy-target-class=true