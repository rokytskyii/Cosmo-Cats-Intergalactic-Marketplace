version: '3.8'
services:
  wiremock:
    image: wiremock/wiremock:latest
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command:
      - "--verbose"
      - "--global-response-templating"
      - "--enable-browser-proxying"

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cosmocats_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres